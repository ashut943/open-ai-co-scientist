# Configuration file for proposal-gen-v1.py

# Provider can also be overridden with LLM_PROVIDER=openai or openrouter.
# Default is OpenAI-compatible (Parley). OpenRouter remains supported for the
# public HF demo when LLM_PROVIDER=openrouter.
llm_provider: "openai"

# OpenRouter API Base URL (used only when llm_provider is openrouter)
openrouter_base_url: "https://openrouter.ai/api/v1"

# OpenRouter model (HF demo / openrouter provider). Compact free default so the
# public demo can finish a multi-call cycle; call_llm falls back to other live
# free models if this one is delisted or rate-limited.
llm_model: "meta-llama/llama-3.2-3b-instruct:free"

# OpenAI-compatible settings (default provider). Parley is the MIT gateway;
# point openai_base_url at https://api.openai.com/v1 for stock OpenAI.
openai_base_url: "https://parley.api.mit.edu/v1"
# Must be a model Parley actually serves (gpt-4o-mini is not on that list).
openai_model: "gpt-5-mini"

# Number of hypotheses to generate
num_hypotheses: 4

# Per-provider request timeout. Keeps slow free endpoints from consuming the
# whole Gradio cycle budget before fallback can try another model.
llm_request_timeout_seconds: 30

# Elo K-factor
elo_k_factor: 32

# Top K hypotheses for evolution
top_k_hypotheses: 2

# Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
logging_level: "INFO"

# Base log file name (without extension)
log_file_name: "app"

# FastAPI host
fastapi_host: "0.0.0.0"

# FastAPI port
fastapi_port: 8000

# Temperature settings for each step
step_temperatures:
  generation: 0.7
  reflection: 0.5
