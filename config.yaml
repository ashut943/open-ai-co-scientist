# Configuration file for proposal-gen-v1.py

# Provider can also be overridden with LLM_PROVIDER=openai or openrouter.
# Default is OpenAI-compatible (Parley). OpenRouter remains supported for the
# public HF demo when LLM_PROVIDER=openrouter.
llm_provider: "openai"

# OpenRouter API Base URL (used only when llm_provider is openrouter)
openrouter_base_url: "https://openrouter.ai/api/v1"

# OpenRouter model (HF demo / openrouter provider). Compact free default so the
# public demo can finish a multi-call cycle; call_llm falls back to other live
# free models if this one is delisted or rate-limited.
llm_model: "meta-llama/llama-3.2-3b-instruct:free"

# OpenAI-compatible settings (default provider). Parley is the MIT gateway;
# point openai_base_url at https://api.openai.com/v1 for stock OpenAI.
openai_base_url: "https://parley.api.mit.edu/v1"
# Must be a model Parley actually serves (gpt-4o-mini is not on that list).
openai_model: "claude-opus-5-5" #"gemini-3.8-flash" #"gpt-5-mini"

# Number of hypotheses to generate
num_hypotheses: 4

# Per-request timeout. Reasoning models (gemini-3.8-flash, gpt-5*) can think for
# over a minute before answering a generation prompt, so 30s was too short.
llm_request_timeout_seconds: 360

# Output cap per LLM call, including reasoning tokens (sent as
# max_completion_tokens). Without it, gateways apply their own default, which
# for Claude models can be ~4k and cuts off a generation of 4 hypotheses
# mid-JSON. 0 sends no cap.
llm_max_output_tokens: 32000

# Max LLM calls in flight at once for reflection reviews and tournament judging
# (they are independent). Lower it if the provider returns rate-limit errors;
# 1 runs them one at a time.
llm_max_concurrency: 4

# USD per 1M tokens as [input, output], used for the cost estimate shown after
# each cycle (list prices; models not listed show token counts only).
token_prices_per_million:
  gemini-3.8-flash: [0.75, 3.75]
  claude-opus-5-5: [4.0, 20.0]

# Elo K-factor
elo_k_factor: 32

# Tournament matches per hypothesis (each match is one LLM judge call).
# 0 runs a full round-robin, which grows as n*(n-1)/2.
tournament_matches_per_hypothesis: 3

# Literature grounding for reflection reviews (novelty/feasibility) and for
# resolving user-provided references. Sources: openalex, arxiv, semantic_scholar
# (set SEMANTIC_SCHOLAR_API_KEY; unauthenticated requests are often rate
# limited), pubmed (add for biomedical goals). Crossref resolves DOIs.
# Set CO_SCIENTIST_DISABLE_LITERATURE=1 to turn all lookups off.
literature_search:
  enabled: true
  sources: ["openalex", "arxiv"]
  results_per_source: 5
  max_papers_in_prompt: 8
  timeout_seconds: 10
  verify_cited_dois: true

# Top K hypotheses for evolution
top_k_hypotheses: 2

# Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
logging_level: "INFO"

# Base log file name (without extension)
log_file_name: "app"

# FastAPI host
fastapi_host: "0.0.0.0"

# FastAPI port
fastapi_port: 8000

# Temperature settings for each step. Currently NOT sent to the provider:
# call_llm always uses the model's default temperature.
step_temperatures:
  generation: 0.7
  reflection: 0.5
